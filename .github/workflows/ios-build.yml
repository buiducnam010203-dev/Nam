name: Build Headlock VIP iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config git

      - name: Install kivy-ios and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/kivy-ios.git

      - name: Create Xcode Project using kivy-ios
        run: |
          # Khởi tạo chuỗi toolchain cho iOS
          toolchain create headlockvip .

      - name: Build Python Dependencies for iOS
        run: |
          cd headlockvip
          toolchain build python3 kivy

      - name: Check Project Output
        run: |
          ls -la headlockvip/
