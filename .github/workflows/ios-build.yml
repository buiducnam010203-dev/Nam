name: Build Headlock VIP iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config git

      - name: Install kivy-ios and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/kivy-ios.git

      - name: Build Python and Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          rm -rf headlockvip
          toolchain create headlockvip .

      - name: Compile and Package IPA Properly
        run: |
          XCODE_PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODE_PROJ" ]; then
            echo "Lỗi: Không tìm thấy file xcodeproj!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$XCODE_PROJ")
          PROJECT_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          cd "$PROJECT_DIR"
          
          # Biên dịch trực tiếp target ứng dụng qua toolchain
          toolchain build "$PROJECT_NAME"
          
          # Đóng gói chuẩn xác thư mục .app thành file ipa có dung lượng đầy đủ
          mkdir -p Payload
          if [ -d "build/libs/$PROJECT_NAME" ]; then
            cp -R "build/libs/$PROJECT_NAME" Payload/
          elif [ -d "build/Release-iphoneos/$PROJECT_NAME.app" ]; then
            cp -R "build/Release-iphoneos/$PROJECT_NAME.app" Payload/
          elif [ -d "build" ]; then
            cp -R build/*.app Payload/ 2>/dev/null || true
          fi
          
          # Dự phòng tìm kiếm toàn cục nếu cấu trúc thư mục thay đổi
          if [ ! "$(ls -A Payload)" ]; then
            APP_FOUND=$(find . -name "*.app" | head -n 1)
            if [ -n "$APP_FOUND" ]; then
              cp -R "$APP_FOUND" Payload/
            fi
          fi
          
          zip -r "$PROJECT_NAME.ipa" Payload/
          mv "$PROJECT_NAME.ipa" ../headlockvip.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlockvip-ipa
          path: headlockvip.ipa
