name: Build Headlock VIP iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config git

      - name: Install kivy-ios and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/kivy-ios.git

      - name: Build Python and Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create headlockvip .

      - name: Compile Xcode Project to IPA
        run: |
          cd headlockvip
          # Mở và build project Xcode dưới dạng không cần chứng chỉ (Unsigned/Debug cho Simulator hoặc Archive)
          xcodebuild -project headlockvip.xcodeproj -scheme headlockvip -configuration Release -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          
          # Gom file app thành thư mục Payload để nén thành .ipa
          mkdir -p Payload
          cp -R build/Release-iphonesimulator/headlockvip.app Payload/
          zip -r headlockvip.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlockvip-ipa
          path: headlockvip/headlockvip.ipa
