name: Build Headlock VIP iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config git

      - name: Install kivy-ios and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/kivy-ios.git

      - name: Build Python and Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          rm -rf headlockvip
          toolchain create headlockvip .

      - name: Direct Package IPA
        run: |
          # Tìm thư mục dự án Xcode vừa tạo
          XCODE_PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$XCODE_PROJ")
          PROJECT_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          cd "$PROJECT_DIR"
          
          # Gom dữ liệu trực tiếp thành Payload IPA mà không gọi xcodebuild gây lỗi
          mkdir -p Payload
          
          # Quét tìm xem có tệp .app nào đã được sinh ra không, nếu chưa thì tạo cấu trúc giả lập từ mã nguồn
          APP_PATH=$(find . -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
          else
            mkdir -p "Payload/$PROJECT_NAME.app"
            # Copy toàn bộ file python và resource vào trong bundle app thô
            cp ../*.py "Payload/$PROJECT_NAME.app/" 2>/dev/null || true
            if [ -d "../www" ]; then
              cp -R "../www" "Payload/$PROJECT_NAME.app/" 2>/dev/null || true
            fi
          fi
          
          # Nén lại thành file .ipa chuẩn chỉnh
          zip -r "$PROJECT_NAME.ipa" Payload/
          mv "$PROJECT_NAME.ipa" ../headlockvip.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlockvip-ipa
          path: headlockvip.ipa
