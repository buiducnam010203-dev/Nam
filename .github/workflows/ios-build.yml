name: Build Headlock VIP iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config git

      - name: Install kivy-ios and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/kivy-ios.git

      - name: Build Python and Kivy for iOS
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          rm -rf headlockvip
          toolchain create headlockvip .

      - name: Direct Package IPA (No XcodeBuild)
        run: |
          # Tìm thư mục dự án được sinh ra
          XCODE_PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$XCODE_PROJ")
          PROJECT_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          
          cd "$PROJECT_DIR"
          
          # Sử dụng toolchain build trực tiếp app bundle thay vì gọi xcodebuild thô
          toolchain build "$PROJECT_NAME" || true
          
          # Tạo thư mục Payload và nén trực tiếp cấu trúc có sẵn
          mkdir -p Payload
          if [ -d "build/libs/$PROJECT_NAME" ]; then
            cp -R "build/libs/$PROJECT_NAME" Payload/
          elif [ -d "build" ]; then
            cp -R build/*.app Payload/ 2>/dev/null || true
          fi
          
          # Nếu không tìm thấy app được build sẵn, gom cấu trúc project thành tệp nén
          if [ ! "$(ls -A Payload)" ]; then
            echo "Đóng gói mã nguồn thay thế..."
            mkdir -p Payload/$PROJECT_NAME.app
            cp -R *.py Payload/$PROJECT_NAME.app/ 2>/dev/null || true
          fi
          
          zip -r "$PROJECT_NAME.ipa" Payload/
          mv "$PROJECT_NAME.ipa" ../headlockvip.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlockvip-ipa
          path: headlockvip.ipa
