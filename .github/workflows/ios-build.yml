name: Build Headlock VIP iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer

      - name: Run Buildozer iOS
        run: |
          # Buildozer trên macOS sẽ cố gắng khởi tạo môi trường Xcode/Kivy-iOS
          buildozer -v ios debug || true

      - name: Find and Move IPA/App
        run: |
          mkdir -p output_ipa
          find bin/ -name "*.ipa" -exec cp {} output_ipa/ \; || true
          find . -name "*.ipa" -exec cp {} output_ipa/ \; || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headlock-vip-ipa
          path: output_ipa/*.ipa
