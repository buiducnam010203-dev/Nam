<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK</title>
    
    <link rel="apple-touch-icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">
    <link rel="icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .app-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            margin-bottom: 15px;
        }

        /* 1. Màn hình nhập Key */
        #keyScreen {
            width: 100%;
            background: rgba(22, 22, 30, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        #keyScreen h2 {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .key-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #121218;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .key-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #22c55e;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* 2. Màn hình chính Dashboard */
        #mainApp {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 90vh;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 22, 30, 0.8);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .title-box { text-align: center; }
        .title-box h1 { font-size: 1.2rem; letter-spacing: 2px; }
        .title-box span { font-size: 0.7rem; color: #22c55e; font-weight: bold; }

        .admin-badge-btn {
            background: #22c55e;
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
        }

        .menu-card {
            width: 100%;
            background: rgba(22, 22, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 10px;
        }

        .menu-item { display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 14px; font-weight: 700; }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333344; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* ON / OFF Bottom Bar */
        .bottom-section { width: 100%; margin-top: 20px; text-align: center; }
        .toggle-container { width: 100%; background: #121218; border-radius: 16px; padding: 4px; display: flex; margin-top: 8px; }
        .toggle-btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; font-weight: 800; color: #555; background: transparent; cursor: pointer; }
        .toggle-btn.active-off { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .toggle-btn.active-on { background: #22c55e; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        /* --- POPUP BẢNG QUẢN LÝ KEY ADMIN --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99;
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            width: 100%;
            max-width: 380px;
            background: #16161e;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #22c55e;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .key-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f0f15;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .action-btn {
            padding: 5px 8px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-del { background: #ef4444; color: #fff; }
        .btn-cp { background: #3b82f6; color: #fff; margin-right: 4px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="app-content">
        
        <!-- MÀN HÌNH NHẬP KEY -->
        <div id="keyScreen">
            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar">
            <h2>XÁC NHẬN KEY</h2>
            <input type="text" id="keyInput" class="key-input" placeholder="Nhập Key (ADMIN123 để quản lý)...">
            <button onclick="checkKey()" class="key-btn">XÁC NHẬN</button>
        </div>

        <!-- MÀN HÌNH CHÍNH -->
        <div id="mainApp">
            <div class="header">
                <span style="color:#ef4444; font-size: 0.8rem; font-weight: bold; cursor: pointer;" onclick="logout()">🔒 Thoát</span>
                <div class="title-box">
                    <h1>HEADLOCK</h1>
                    <span id="keyLabelInfo">KEY: VIP</span>
                </div>
                <!-- Nút Quản Lý Key riêng cho bạn -->
                <div id="adminPanelBtn" class="admin-badge-btn" onclick="openAdminPanel()">🔑 Q.LÝ KEY</div>
            </div>

            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar" style="margin-top: 10px;">

            <!-- Bảng chức năng -->
            <div class="menu-card">
                <div class="menu-item">
                    <div class="item-left"><span style="color: #ef4444;">🎯</span> REG FILES</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #3b82f6;">🚀</span> BOOST RAM</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #a855f7;">💀</span> HEADLOCK</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #06b6d4;">⚙️</span> FIX RUNG</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <div class="bottom-section">
                <span style="font-size: 0.75rem; color: #666; font-weight: 700;">STARTING FILES</span>
                <div class="toggle-container">
                    <button class="toggle-btn" id="btnOn" onclick="setMainState(true)">ON</button>
                    <button class="toggle-btn active-off" id="btnOff" onclick="setMainState(false)">OFF</button>
                </div>
            </div>
        </div>

    </div>

    <!-- POPUP BẢNG QUẢN LÝ KEY ADMIN -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <h3 style="color:#22c55e; text-align: center; font-size: 1.1rem;">👑 BẢNG QUẢN LÝ KEY</h3>
            
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 0.75rem; color: #aaa;">TẠO KEY MỚI</label>
                <input type="text" id="newKeyName" class="key-input" placeholder="Tên Key..." style="padding: 10px; font-size: 0.9rem;">
                <input type="number" id="newKeyHours" class="key-input" placeholder="Thời hạn (Số giờ)..." style="padding: 10px; font-size: 0.9rem;">
                <button onclick="createNewKey()" class="key-btn" style="padding: 10px; font-size: 0.9rem;">+ TẠO KEY</button>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 5px 0;">

            <label style="font-size: 0.75rem; color: #aaa;">DANH SÁCH KEY</label>
            <div id="keyListContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto;">
                <!-- Key sẽ hiển thị ở đây -->
            </div>

            <button onclick="closeAdminPanel()" class="key-btn" style="background: #333; padding: 10px; margin-top: 5px;">ĐÓNG BẢNG</button>
        </div>
    </div>

    <script>
        const ADMIN_CODE = "ADMIN123";

        let keyStorage = JSON.parse(localStorage.getItem('headlock_keys_db')) || {
            "VIP1H": 1,
            "HEADLOCK24H": 24
        };

        function saveKeys() {
            localStorage.setItem('headlock_keys_db', JSON.stringify(keyStorage));
        }

        function checkKey() {
            let key = document.getElementById('keyInput').value.trim();
            if (!key) {
                alert("Vui lòng nhập Key!");
                return;
            }

            if (key === ADMIN_CODE) {
                document.getElementById('adminPanelBtn').style.display = 'block';
                document.getElementById('keyLabelInfo').innerText = "QUẢN TRỊ VIÊN";
            } else if (keyStorage[key]) {
                document.getElementById('adminPanelBtn').style.display = 'none';
                document.getElementById('keyLabelInfo').innerText = `KEY: ${keyStorage[key]} GIỜ`;
            } else {
                alert("Key không hợp lệ hoặc đã bị xóa!");
                return;
            }

            document.getElementById('keyScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
        }

        function openAdminPanel() {
            renderKeyList();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function createNewKey() {
            let name = document.getElementById('newKeyName').value.trim().toUpperCase();
            let hours = parseInt(document.getElementById('newKeyHours').value);

            if (!name || isNaN(hours)) {
                alert("Vui lòng điền đủ thông tin!");
                return;
            }

            keyStorage[name] = hours;
            saveKeys();
            renderKeyList();
            
            document.getElementById('newKeyName').value = "";
            document.getElementById('newKeyHours').value = "";
            alert(`Đã tạo thành công Key: ${name}`);
        }

        function deleteKey(name) {
            if (confirm(`Bạn có muốn xóa Key: ${name}?`)) {
                delete keyStorage[name];
                saveKeys();
                renderKeyList();
            }
        }

        function copyKey(name) {
            navigator.clipboard.writeText(name);
            alert(`Đã chép: ${name}`);
        }

        function renderKeyList() {
            let container = document.getElementById('keyListContainer');
            container.innerHTML = "";

            Object.keys(keyStorage).forEach(k => {
                let div = document.createElement('div');
                div.className = 'key-row';
                div.innerHTML = `
                    <div>
                        <strong style="color: #22c55e;">${k}</strong>
                        <div style="font-size: 0.7rem; color: #888;">${keyStorage[k]} Giờ</div>
                    </div>
                    <div>
                        <button class="action-btn btn-cp" onclick="copyKey('${k}')">COPY</button>
                        <button class="action-btn btn-del" onclick="deleteKey('${k}')">XÓA</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function logout() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('keyScreen').style.display = 'flex';
            document.getElementById('keyInput').value = "";
        }

        function setMainState(isOn) {
            document.getElementById('btnOn').className = isOn ? 'toggle-btn active-on' : 'toggle-btn';
            document.getElementById('btnOff').className = isOn ? 'toggle-btn' : 'toggle-btn active-off';
        }

        /* Matrix Rain */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
