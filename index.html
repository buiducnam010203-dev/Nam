<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK</title>
    
    <!-- Link ảnh trực tiếp làm Icon iOS & Favicon -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">
    <link rel="icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; overflow: hidden; position: relative; }
        
        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; }
        .app-content { position: relative; z-index: 2; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

        .avatar-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); margin-bottom: 15px; }

        /* Màn hình nhập Key */
        #keyScreen { width: 100%; background: rgba(22, 22, 30, 0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; }
        .key-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: #121218; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        .key-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }

        /* Màn hình chính */
        #mainApp { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: space-between; min-height: 90vh; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn { font-size: 1.5rem; cursor: pointer; padding: 5px; }

        .menu-card { width: 100%; background: rgba(22, 22, 30, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 14px; font-weight: 700; }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333344; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Bottom Section */
        .bottom-section { width: 100%; margin-top: 20px; text-align: center; }
        .toggle-container { width: 100%; background: #121218; border-radius: 16px; padding: 4px; display: flex; margin-top: 8px; }
        .toggle-btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; font-weight: 800; color: #555; background: transparent; cursor: pointer; }
        .toggle-btn.active-off { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .toggle-btn.active-on { background: #22c55e; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        /* Bảng Popup Quản Lý Key */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 10; backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 16px; }
        .modal-card { width: 100%; max-width: 380px; background: #16161e; border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 16px; text-align: center; }
        .modal-card h3 { font-size: 1.2rem; color: #fff; letter-spacing: 1px; }
        .key-info-box { background: #0f0f15; padding: 12px; border-radius: 10px; font-size: 0.9rem; text-align: left; display: flex; flex-direction: column; gap: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .close-btn { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="app-content">
        
        <!-- 1. MÀN HÌNH NHẬP KEY (CÓ AVATAR) -->
        <div id="keyScreen">
            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar">
            <h2>XÁC NHẬN KEY</h2>
            <input type="text" id="keyInput" class="key-input" placeholder="Nhập Key tại đây...">
            <button onclick="checkKey()" class="key-btn">XÁC NHẬN</button>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH (CÓ AVATAR + MENU QUẢN LÝ KEY) -->
        <div id="mainApp">
            <div class="header">
                <span style="color:#ccc;">&#8592; Back</span>
                <div style="text-align: center;">
                    <h1 style="font-size: 1.3rem; letter-spacing: 2px;">HEADLOCK</h1>
                    <span id="currentKeyType" style="font-size: 0.7rem; color: #22c55e; font-weight: 700;">KEY: 1 GIỜ</span>
                </div>
                <!-- Bấm vào ☰ để mở Bảng Quản Lý Key -->
                <div class="menu-btn" onclick="openKeyManager()">&#9776;</div>
            </div>

            <!-- Avatar màn hình chính -->
            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar">

            <div class="menu-card">
                <div class="menu-item">
                    <div class="item-left"><span style="color: #ef4444;">🎯</span> REG FILES</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #3b82f6;">🚀</span> BOOST RAM</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #a855f7;">💀</span> HEADLOCK</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #06b6d4;">⚙️</span> FIX RUNG</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <div class="bottom-section">
                <span style="font-size: 0.75rem; color: #666; font-weight: 700;">STARTING FILES</span>
                <div class="toggle-container">
                    <button class="toggle-btn" id="btnOn" onclick="setMainState(true)">ON</button>
                    <button class="toggle-btn active-off" id="btnOff" onclick="setMainState(false)">OFF</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. POPUP BẢNG QUẢN LÝ KEY -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-card">
            <h3>🔑 QUẢN LÝ KEY</h3>
            <div class="key-info-box">
                <div><strong>Key hiện tại:</strong> <span id="displayKey" style="color: #22c55e;">---</span></div>
                <div><strong>Thời hạn:</strong> <span style="color: #3b82f6;">1 Giờ</span></div>
                <div><strong>Trạng thái:</strong> <span style="color: #22c55e;">Đang hoạt động</span></div>
            </div>
            
            <input type="text" id="newKeyInput" class="key-input" placeholder="Nhập Key mới để đổi...">
            <button onclick="changeKey()" class="key-btn">ĐỔI KEY MỚI</button>
            <button onclick="closeKeyManager()" class="close-btn">ĐÓNG</button>
        </div>
    </div>

    <script>
        let currentKey = "";

        function checkKey() {
            let key = document.getElementById('keyInput').value.trim();
            if (key !== "") {
                currentKey = key;
                document.getElementById('displayKey').innerText = currentKey;
                document.getElementById('keyScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
            } else {
                alert("Vui lòng nhập Key!");
            }
        }

        function openKeyManager() {
            document.getElementById('keyModal').style.display = 'flex';
        }

        function closeKeyManager() {
            document.getElementById('keyModal').style.display = 'none';
        }

        function changeKey() {
            let newKey = document.getElementById('newKeyInput').value.trim();
            if (newKey !== "") {
                currentKey = newKey;
                document.getElementById('displayKey').innerText = currentKey;
                document.getElementById('newKeyInput').value = "";
                alert("Đã đổi Key thành công!");
                closeKeyManager();
            } else {
                alert("Vui lòng nhập Key mới!");
            }
        }

        function setMainState(isOn) {
            document.getElementById('btnOn').className = isOn ? 'toggle-btn active-on' : 'toggle-btn';
            document.getElementById('btnOff').className = isOn ? 'toggle-btn' : 'toggle-btn active-off';
        }

        /* Matrix Code Rain */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
