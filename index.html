<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK</title>
    
    <link rel="apple-touch-icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">
    <link rel="icon" href="https://i.ibb.co/VMyL33B/avatar.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; overflow-x: hidden; position: relative; }
        
        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.25; }
        .app-content { position: relative; z-index: 2; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

        .avatar-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); margin-bottom: 15px; }

        /* Màn hình nhập Key */
        #keyScreen { width: 100%; background: rgba(22, 22, 30, 0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; }
        .key-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: #121218; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        .key-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }

        /* Màn hình người dùng (User Dashboard) */
        #mainApp { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: space-between; min-height: 85vh; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .menu-card { width: 100%; background: rgba(22, 22, 30, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 14px; font-weight: 700; }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333344; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }

        .bottom-section { width: 100%; margin-top: 20px; text-align: center; }
        .toggle-container { width: 100%; background: #121218; border-radius: 16px; padding: 4px; display: flex; margin-top: 8px; }
        .toggle-btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; font-weight: 800; color: #555; background: transparent; cursor: pointer; }
        .toggle-btn.active-off { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .toggle-btn.active-on { background: #22c55e; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        /* --- BẢNG ĐIỀU KHIỂN ADMIN DÀNH RIÊNG CHO BẠN --- */
        #adminApp { display: none; width: 100%; background: rgba(18, 18, 24, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid #22c55e; flex-direction: column; gap: 16px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .admin-header h2 { color: #22c55e; font-size: 1.2rem; }
        .create-box { display: flex; flex-direction: column; gap: 10px; background: #0f0f15; padding: 15px; border-radius: 12px; }
        .key-list { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; }
        .key-item { display: flex; justify-content: space-between; align-items: center; background: #181822; padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); }
        .btn-del { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .logout-btn { background: #333; color: #ccc; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="app-content">
        
        <!-- 1. MÀN HÌNH NHẬP KEY -->
        <div id="keyScreen">
            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar">
            <h2>XÁC NHẬN KEY</h2>
            <input type="text" id="keyInput" class="key-input" placeholder="Nhập Key (Nhập ADMIN123 để mở Admin)...">
            <button onclick="checkKey()" class="key-btn">XÁC NHẬN</button>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH CHO NGƯỜI DÙNG -->
        <div id="mainApp">
            <div class="header">
                <span style="color:#ccc;" onclick="logout()">&#8592; Đăng xuất</span>
                <div style="text-align: center;">
                    <h1 style="font-size: 1.3rem; letter-spacing: 2px;">HEADLOCK</h1>
                    <span id="keyExpiryInfo" style="font-size: 0.7rem; color: #22c55e; font-weight: 700;">KEY HOẠT ĐỘNG</span>
                </div>
                <div style="width: 50px;"></div>
            </div>

            <img src="https://i.ibb.co/VMyL33B/avatar.jpg" class="avatar-img" alt="Avatar">

            <div class="menu-card">
                <div class="menu-item">
                    <div class="item-left"><span style="color: #ef4444;">🎯</span> REG FILES</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #3b82f6;">🚀</span> BOOST RAM</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #a855f7;">💀</span> HEADLOCK</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #06b6d4;">⚙️</span> FIX RUNG</div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <div class="bottom-section">
                <span style="font-size: 0.75rem; color: #666; font-weight: 700;">STARTING FILES</span>
                <div class="toggle-container">
                    <button class="toggle-btn" id="btnOn" onclick="setMainState(true)">ON</button>
                    <button class="toggle-btn active-off" id="btnOff" onclick="setMainState(false)">OFF</button>
                </div>
            </div>
        </div>

        <!-- 3. BẢNG QUẢN LÝ KEY DÀNH RIÊNG CHO ADMIN (BẠN) -->
        <div id="adminApp">
            <div class="admin-header">
                <h2>👑 ADMIN PANELS</h2>
                <img src="https://i.ibb.co/VMyL33B/avatar.jpg" style="width: 35px; height: 35px; border-radius: 50%; border: 1px solid #22c55e;">
            </div>

            <!-- Tạo Key Mới -->
            <div class="create-box">
                <span style="font-size: 0.85rem; font-weight: bold; color: #ccc;">TẠO KEY MỚI</span>
                <input type="text" id="newKeyName" class="key-input" placeholder="Tên Key (Ví dụ: VIP123)..." style="font-size: 0.9rem; padding: 10px;">
                <input type="number" id="newKeyHours" class="key-input" placeholder="Thời hạn (Số giờ)..." style="font-size: 0.9rem; padding: 10px;">
                <button onclick="createNewKey()" class="key-btn" style="padding: 10px; font-size: 0.9rem;">TẠO KEY</button>
            </div>

            <!-- Danh sách Key -->
            <span style="font-size: 0.85rem; font-weight: bold; color: #ccc; margin-top: 5px;">DANH SÁCH KEY ĐÃ TẠO</span>
            <div class="key-list" id="keyListContainer">
                <!-- Data Key sẽ hiện ở đây -->
            </div>

            <button onclick="logout()" class="logout-btn">THOÁT ADMIN</button>
        </div>

    </div>

    <script>
        const ADMIN_KEY = "ADMIN123"; // Key Admin của bạn

        // Lưu trữ danh sách Key mặc định
        let databaseKeys = JSON.parse(localStorage.getItem('app_keys')) || {
            "HEADLOCK1H": 1,
            "VIP24H": 24
        };

        function saveKeys() {
            localStorage.setItem('app_keys', JSON.stringify(databaseKeys));
        }

        function checkKey() {
            let input = document.getElementById('keyInput').value.trim();
            
            // 1. Kiểm tra nếu là ADMIN
            if (input === ADMIN_KEY) {
                document.getElementById('keyScreen').style.display = 'none';
                document.getElementById('adminApp').style.display = 'flex';
                renderKeyList();
                return;
            }

            // 2. Kiểm tra nếu là User thường
            if (databaseKeys[input]) {
                document.getElementById('keyExpiryInfo').innerText = `KEY: ${databaseKeys[input]} GIỜ`;
                document.getElementById('keyScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
            } else {
                alert("Key không hợp lệ hoặc đã bị xóa!");
            }
        }

        // Tạo Key mới dành cho Admin
        function createNewKey() {
            let name = document.getElementById('newKeyName').value.trim().toUpperCase();
            let hours = parseInt(document.getElementById('newKeyHours').value);

            if (!name || isNaN(hours) || hours <= 0) {
                alert("Vui lòng nhập tên Key và số giờ hợp lệ!");
                return;
            }

            databaseKeys[name] = hours;
            saveKeys();
            renderKeyList();
            
            document.getElementById('newKeyName').value = "";
            document.getElementById('newKeyHours').value = "";
            alert(`Đã tạo thành công Key: ${name} (${hours} giờ)`);
        }

        // Xóa Key
        function deleteKey(keyName) {
            if (confirm(`Bạn có chắc muốn xóa Key: ${keyName}?`)) {
                delete databaseKeys[keyName];
                saveKeys();
                renderKeyList();
            }
        }

        // Hiển thị danh sách Key
        function renderKeyList() {
            let container = document.getElementById('keyListContainer');
            container.innerHTML = "";

            Object.keys(databaseKeys).forEach(key => {
                let div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `
                    <div>
                        <strong style="color:#22c55e;">${key}</strong>
                        <div style="font-size:0.75rem; color:#aaa;">Thời hạn: ${databaseKeys[key]} giờ</div>
                    </div>
                    <button class="btn-del" onclick="deleteKey('${key}')">XÓA</button>
                `;
                container.appendChild(div);
            });
        }

        function logout() {
            document.getElementById('adminApp').style.display = 'none';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('keyScreen').style.display = 'flex';
            document.getElementById('keyInput').value = "";
        }

        function setMainState(isOn) {
            document.getElementById('btnOn').className = isOn ? 'toggle-btn active-on' : 'toggle-btn';
            document.getElementById('btnOff').className = isOn ? 'toggle-btn' : 'toggle-btn active-off';
        }

        /* Matrix Rain Effect */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
