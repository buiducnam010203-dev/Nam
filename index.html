<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK VIP</title>
    
    <link rel="apple-touch-icon" href="avatar.jpg">
    <link rel="icon" href="avatar.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; overflow-x: hidden; position: relative; }

        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.3; }
        .app-content { position: relative; z-index: 2; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

        .avatar-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); margin-bottom: 12px; }

        /* MÀN HÌNH NHẬP KEY */
        #keyScreen { width: 100%; background: rgba(22, 22, 30, 0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: center; }
        #keyScreen h2 { font-size: 1.3rem; letter-spacing: 2px; }
        .key-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: #121218; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        .key-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .admin-entry-btn { font-size: 0.8rem; color: #22c55e; text-decoration: underline; cursor: pointer; font-weight: bold; margin-top: 5px; }

        /* MÀN HÌNH CHÍNH */
        #mainApp { display: none; width: 100%; flex-direction: column; align-items: center; gap: 15px; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .title-box { text-align: center; }
        .title-box h1 { font-size: 1.2rem; letter-spacing: 2px; }
        .title-box span { font-size: 0.7rem; color: #22c55e; font-weight: bold; }

        .menu-card { width: 100%; background: rgba(22, 22, 30, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 20px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 14px; font-weight: 700; }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333344; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* ON / OFF Bottom Bar */
        .bottom-section { width: 100%; margin-top: 10px; text-align: center; }
        .toggle-container { width: 100%; background: #121218; border-radius: 16px; padding: 4px; display: flex; margin-top: 8px; }
        .toggle-btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; font-weight: 800; color: #555; background: transparent; cursor: pointer; }
        .toggle-btn.active-off { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .toggle-btn.active-on { background: #22c55e; color: #fff; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        /* POPUP ADMIN */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 16px; }
        .modal-card { width: 100%; max-width: 380px; background: #16161e; border-radius: 20px; padding: 20px; border: 1px solid #22c55e; display: flex; flex-direction: column; gap: 12px; }
        .key-row { display: flex; justify-content: space-between; align-items: center; background: #0f0f15; padding: 10px; border-radius: 10px; font-size: 0.85rem; }

        /* BẢNG TERMINAL RUN CODE CỰC TỐC */
        #hackerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .hacker-box { width: 100%; max-width: 380px; background: #000; border: 1.5px solid #22c55e; border-radius: 16px; padding: 16px; font-family: monospace; color: #22c55e; font-size: 0.75rem; height: 260px; overflow: hidden; box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); word-break: break-all; }

        /* CHỌN GAME */
        #gameModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 300; backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 20px; }
        .game-card { width: 100%; max-width: 360px; background: #16161e; border-radius: 20px; padding: 20px; border: 1px solid #3b82f6; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .game-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem; color: #fff; cursor: pointer; }
        .btn-ff-normal { background: linear-gradient(135deg, #f97316, #ef4444); }
        .btn-ff-max { background: linear-gradient(135deg, #a855f7, #3b82f6); }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="app-content">
        <!-- 1. MÀN HÌNH NHẬP KEY -->
        <div id="keyScreen">
            <img src="avatar.jpg" class="avatar-img" alt="Avatar">
            <h2>XÁC NHẬN KEY</h2>
            <input type="text" id="keyInput" class="key-input" placeholder="Nhập Key của bạn...">
            <button onclick="checkKey()" class="key-btn" id="btnCheckKey">XÁC NHẬN</button>
            <div class="admin-entry-btn" onclick="openAdminAuth()">🔑 Quản Lý Key (Dành cho Admin)</div>
        </div>

        <!-- 2. MÀN HÌNH CHÍNH -->
        <div id="mainApp">
            <div class="header">
                <span style="color:#ef4444; font-size: 0.85rem; font-weight: bold; cursor: pointer;" onclick="logout()">🔒 Thoát</span>
                <div class="title-box">
                    <h1>HEADLOCK</h1>
                    <span id="keyLabel">KEY: ACTIVE</span>
                </div>
                <div style="font-size: 1.2rem;">⚙️</div>
            </div>

            <img src="avatar.jpg" class="avatar-img" alt="Avatar">

            <div class="menu-card">
                <div class="menu-item">
                    <div class="item-left"><span style="color: #ef4444;">🎯</span> REG FILES</div>
                    <label class="switch"><input type="checkbox" id="sw1" onchange="triggerHackerEffect(this)"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #3b82f6;">🚀</span> BOOST RAM</div>
                    <label class="switch"><input type="checkbox" id="sw2" onchange="triggerHackerEffect(this)"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #a855f7;">💀</span> HEADLOCK</div>
                    <label class="switch"><input type="checkbox" id="sw3" onchange="triggerHackerEffect(this)"><span class="slider"></span></label>
                </div>
                <div class="menu-item">
                    <div class="item-left"><span style="color: #06b6d4;">⚙️</span> FIX RUNG</div>
                    <label class="switch"><input type="checkbox" id="sw4" onchange="triggerHackerEffect(this)"><span class="slider"></span></label>
                </div>
            </div>

            <div class="bottom-section">
                <span style="font-size: 0.75rem; color: #666; font-weight: 700;">STARTING FILES</span>
                <div class="toggle-container">
                    <button class="toggle-btn" id="btnOn" onclick="clickOnButton()">ON</button>
                    <button class="toggle-btn active-off" id="btnOff" onclick="setMainState(false)">OFF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <h3 style="color:#22c55e; text-align: center;">👑 QUẢN LÝ KEY ADMIN</h3>
            <input type="text" id="newKeyName" class="key-input" placeholder="Tên Key Mới..." style="padding: 10px;">
            <input type="number" id="newKeyHours" class="key-input" placeholder="Số Giờ Hạn..." style="padding: 10px;">
            <button onclick="createNewKey()" class="key-btn" id="btnCreateKey" style="padding: 10px;">+ TẠO KEY MỚI</button>
            <hr style="border: 0; border-top: 1px solid #333;">
            <div id="keyListContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto;">
                <span style="color:#888; font-size:0.8rem; text-align:center;">Đang tải danh sách key...</span>
            </div>
            <button onclick="closeAdminPanel()" class="key-btn" style="background: #333; padding: 10px;">ĐÓNG BẢNG</button>
        </div>
    </div>

    <!-- HACKER MODAL -->
    <div id="hackerModal">
        <div class="hacker-box" id="hackerConsole"></div>
    </div>

    <!-- GAME MODAL -->
    <div id="gameModal">
        <div class="game-card">
            <h2 style="color: #fff; font-size: 1.2rem;">CHỌN PHIÊN BẢN GAME</h2>
            <button class="game-btn btn-ff-normal" onclick="launchGame('freefire')">🔥 FREE FIRE THƯỜNG</button>
            <button class="game-btn btn-ff-max" onclick="launchGame('freefiremax')">⚡ FREE FIRE MAX</button>
            <button onclick="closeGameModal()" style="background: transparent; border: none; color: #888; margin-top: 5px; cursor: pointer;">Hủy bỏ</button>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "ADMIN123";
        
        // SERVER ONLINE LƯU KEY CHUNG CHO TẤT CẢ MỌI NGHƯỜI
        const BIN_ID = "6798fa72ad19ca34f8f411ce";
        const API_KEY = "$2a$10$U27fVdndR75C7s4790oGteK2i/r08R2/O.BkWmB5G4GqE6P7YtCee";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let keyStorage = {};

        // Tải danh sách Key từ máy chủ Server về
        async function fetchOnlineKeys() {
            try {
                let res = await fetch(API_URL + "/latest", {
                    headers: { "X-Master-Key": API_KEY }
                });
                let data = await res.json();
                keyStorage = data.record || {};
            } catch (err) {
                console.error("Lỗi kết nối cơ sở dữ liệu online!", err);
            }
        }

        // Cập nhật danh sách Key mới lên Server Online
        async function updateOnlineKeys() {
            try {
                await fetch(API_URL, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify(keyStorage)
                });
                return true;
            } catch (err) {
                alert("Lỗi không thể lưu Key lên hệ thống!");
                return false;
            }
        }

        async function checkKey() {
            let btn = document.getElementById('btnCheckKey');
            let key = document.getElementById('keyInput').value.trim().toUpperCase();
            
            if(!key) { alert("Vui lòng nhập Key!"); return; }

            btn.innerText = "Đang kiểm tra...";
            btn.disabled = true;

            await fetchOnlineKeys(); // Lấy dữ liệu mới nhất từ server

            if (keyStorage[key]) {
                document.getElementById('keyLabel').innerText = `KEY: ${keyStorage[key]} GIỜ`;
                document.getElementById('keyScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                resetAllSwitches();
            } else {
                alert("Key không tồn tại hoặc đã hết hạn!");
            }

            btn.innerText = "XÁC NHẬN";
            btn.disabled = false;
        }

        function resetAllSwitches() {
            document.getElementById('sw1').checked = false;
            document.getElementById('sw2').checked = false;
            document.getElementById('sw3').checked = false;
            document.getElementById('sw4').checked = false;
        }

        async function openAdminAuth() {
            let pass = prompt("Nhập Mật Khẩu Admin:");
            if (pass === ADMIN_PASS) {
                document.getElementById('adminModal').style.display = 'flex';
                await fetchOnlineKeys();
                renderKeyList();
            } else if (pass !== null) {
                alert("Sai mật khẩu Admin!");
            }
        }

        function closeAdminPanel() { document.getElementById('adminModal').style.display = 'none'; }

        async function createNewKey() {
            let name = document.getElementById('newKeyName').value.trim().toUpperCase();
            let hours = parseInt(document.getElementById('newKeyHours').value);
            let btn = document.getElementById('btnCreateKey');

            if (!name || isNaN(hours)) { alert("Vui lòng điền tên Key và số giờ!"); return; }

            btn.innerText = "Đang lưu lên Server...";
            btn.disabled = true;

            await fetchOnlineKeys();
            keyStorage[name] = hours;
            
            let success = await updateOnlineKeys();
            if(success) {
                renderKeyList();
                document.getElementById('newKeyName').value = "";
                document.getElementById('newKeyHours').value = "";
                alert(`Đã tạo thành công Key Online: ${name}`);
            }

            btn.innerText = "+ TẠO KEY MỚI";
            btn.disabled = false;
        }

        async function deleteKey(name) {
            if(confirm(`Bạn có chắc muốn xóa Key ${name}?`)) {
                delete keyStorage[name];
                await updateOnlineKeys();
                renderKeyList();
            }
        }

        function renderKeyList() {
            let container = document.getElementById('keyListContainer');
            container.innerHTML = "";
            let keys = Object.keys(keyStorage);
            
            if(keys.length === 0) {
                container.innerHTML = `<span style="color:#888; font-size:0.8rem; text-align:center;">Chưa có Key nào.</span>`;
                return;
            }

            keys.forEach(k => {
                let div = document.createElement('div');
                div.className = 'key-row';
                div.innerHTML = `<span><b>${k}</b> (${keyStorage[k]}h)</span>
                <button onclick="deleteKey('${k}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer;">Xóa</button>`;
                container.appendChild(div);
            });
        }

        // HÀM CHẠY LUỒNG CODE TỐC ĐỘ BÀN THỜ (1MS / DÒNG)
        function triggerHackerEffect(elem) {
            if (elem.checked) {
                let consoleBox = document.getElementById('hackerConsole');
                let hackerModal = document.getElementById('hackerModal');
                
                hackerModal.style.display = 'flex';
                consoleBox.innerHTML = "";

                let totalLines = 80;
                let step = 0;

                let timer = setInterval(() => {
                    if (step < totalLines) {
                        let hex1 = Math.random().toString(16).substring(2, 8).toUpperCase();
                        let hex2 = Math.random().toString(16).substring(2, 10).toUpperCase();
                        
                        let line = document.createElement('div');
                        line.innerHTML = `> [0x${hex1}] INJECTING_MEMORY_BLOCK_0x${hex2}... OK`;
                        consoleBox.appendChild(line);

                        consoleBox.scrollTop = consoleBox.scrollHeight;
                        step++;
                    } else {
                        let finalLine = document.createElement('div');
                        finalLine.style.color = "#ffffff";
                        finalLine.style.fontWeight = "bold";
                        finalLine.innerHTML = "> [STATUS] ACTIVATED & SECURED!";
                        consoleBox.appendChild(finalLine);
                        consoleBox.scrollTop = consoleBox.scrollHeight;

                        clearInterval(timer);
                        
                        setTimeout(() => { 
                            hackerModal.style.display = 'none'; 
                        }, 150);
                    }
                }, 1);
            }
        }

        function clickOnButton() {
            setMainState(true);
            document.getElementById('gameModal').style.display = 'flex';
        }

        function setMainState(isOn) {
            document.getElementById('btnOn').className = isOn ? 'toggle-btn active-on' : 'toggle-btn';
            document.getElementById('btnOff').className = isOn ? 'toggle-btn' : 'toggle-btn active-off';
        }

        function closeGameModal() { document.getElementById('gameModal').style.display = 'none'; }

        function launchGame(type) {
            closeGameModal();
            if (type === 'freefire') {
                window.location.href = "freefire://";
            } else {
                window.location.href = "freefiremax://";
            }
        }

        function logout() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('keyScreen').style.display = 'flex';
            document.getElementById('keyInput').value = "";
        }

        /* Matrix Code Background */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '0123456789ABCDEF';
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Tự động tải Key Online khi vừa mở trang Web
        fetchOnlineKeys();
    </script>
</body>
</html>
