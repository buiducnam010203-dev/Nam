<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Web Clip Ứng Dụng</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { background-color: #007AFF; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Trang Tạo Cấu Hình Web Clip</h2>
    
    <label>Tên Ứng Dụng (Label):</label>
    <input type="text" id="appName" placeholder="Ví dụ: App Của Tôi">

    <label>Đường dẫn trang web (URL):</label>
    <input type="url" id="appUrl" placeholder="https://...">

    <button onclick="generateProfile()">Tải Profile Về Máy</button>

    <script>
        function generateProfile() {
            const name = document.getElementById('appName').value || "My Web Clip";
            const url = document.getElementById('appUrl').value || "https://example.com";
            
            // Tạo chuỗi ngẫu nhiên (UUID) chuẩn cho Apple Profile
            const payloadUUID = crypto.randomUUID();
            const profileUUID = crypto.randomUUID();

            const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>FullScreen</key><true/>
            <key>IconIsPrecomposed</key><true/>
            <key>IsRemovable</key><true/>
            <key>Label</key><string>${name}</string>
            <key>PayloadIdentifier</key><string>com.webclip.${payloadUUID}</string>
            <key>PayloadType</key><string>com.apple.webClip.managed</string>
            <key>PayloadUUID</key><string>${payloadUUID}</string>
            <key>PayloadVersion</key><integer>1</integer>
            <key>URL</key><string>${url}</string>
        </dict>
    </array>
    <key>PayloadDisplayName</key><string>${name}</string>
    <key>PayloadIdentifier</key><string>com.profile.${profileUUID}</string>
    <key>PayloadType</key><string>Configuration</string>
    <key>PayloadUUID</key><string>${profileUUID}</string>
    <key>PayloadVersion</key><integer>1</integer>
</dict>
</plist>`;

            // Tạo file tải xuống với định dạng đặc biệt của Apple
            const blob = new Blob([xmlContent], { type: 'application/x-apple-aspen-config' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${name}.mobileconfig`;
            link.click();
        }
    </script>
</body>
</html>
