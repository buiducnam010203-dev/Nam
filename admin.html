<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUẢN LÝ ADMIN - HEADLOCK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }
        .admin-box { width: 100%; max-width: 400px; background: #16161e; border-radius: 20px; padding: 20px; border: 1px solid #22c55e; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
        .key-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); background: #0f0f15; color: #fff; font-size: 0.9rem; outline: none; }
        .key-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #22c55e; color: #fff; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .key-row { display: flex; justify-content: space-between; align-items: center; background: #0f0f15; padding: 10px; border-radius: 10px; font-size: 0.75rem; gap: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .key-actions { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP ADMIN -->
    <div class="admin-box" id="loginBox">
        <h2 style="color:#22c55e; text-align:center;">🔐 ĐĂNG NHẬP ADMIN</h2>
        <input type="password" id="adminPassInput" class="key-input" placeholder="Nhập mật khẩu Admin...">
        <button onclick="loginAdmin()" class="key-btn">TRUY CẬP</button>
    </div>

    <!-- BẢNG QUẢN LÝ (ẨN KẾT QUẢ CHO ĐẾN KHI NHẬP ĐÚNG PASS) -->
    <div class="admin-box" id="panelBox" style="display: none;">
        <h3 style="color:#22c55e; text-align: center;">👑 QUẢN LÝ KEY ONLINE</h3>
        <textarea id="newKeyName" class="key-input" placeholder="Tên Key (VD: VIP1, VIP2... cách nhau dấu phẩy)" style="height: 50px; resize: none;"></textarea>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="newKeyHours" class="key-input" placeholder="Số giờ...">
            <input type="number" id="newKeyUses" class="key-input" placeholder="Số lượt...">
        </div>
        <button onclick="createNewKeysBulk()" class="key-btn">+ TẠO / CẬP NHẬT KEY</button>
        <hr style="border: 0; border-top: 1px solid #333; margin: 5px 0;">
        <div id="keyListContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;"></div>
        <button onclick="location.reload()" class="key-btn" style="background: #333; margin-top: 5px;">ĐĂNG XUẤT</button>
    </div>

    <script>
        const ADMIN_PASS = "ADMIN123"; // Bạn có thể đổi mật khẩu ở đây
        const FIREBASE_URL = "https://headlock-df1ab-default-rtdb.firebaseio.com/keys";

        function loginAdmin() {
            let p = document.getElementById('adminPassInput').value;
            if (p === ADMIN_PASS) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'flex';
                renderKeyList();
            } else {
                alert("Sai mật khẩu Admin!");
            }
        }

        async function fetchOnlineKeys() {
            try {
                let res = await fetch(`${FIREBASE_URL}.json`);
                let data = await res.json();
                return data || {};
            } catch (e) { return {}; }
        }

        async function saveOnlineKeys(keys) {
            await fetch(`${FIREBASE_URL}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(keys)
            });
        }

        async function createNewKeysBulk() {
            let rawInput = document.getElementById('newKeyName').value.trim();
            let hours = parseInt(document.getElementById('newKeyHours').value);
            let uses = parseInt(document.getElementById('newKeyUses').value);
            if (!rawInput || isNaN(hours) || isNaN(uses)) { alert("Vui lòng điền đủ thông tin!"); return; }

            let keyList = rawInput.split(',').map(k => k.trim().toUpperCase()).filter(k => k.length > 0);
            let keys = await fetchOnlineKeys();
            keyList.forEach(k => { keys[k] = { hours: hours, uses: uses, device_ip: null, activated_at: null }; });
            await saveOnlineKeys(keys);

            document.getElementById('newKeyName').value = "";
            document.getElementById('newKeyHours').value = "";
            document.getElementById('newKeyUses').value = "";
            renderKeyList();
            alert(`Đã tạo thành công ${keyList.length} Key!`);
        }

        function copyKeyText(name) {
            navigator.clipboard.writeText(name).then(() => alert(`Đã sao chép: ${name}`));
        }

        async function deleteKey(name) {
            if(confirm(`Bạn có chắc muốn xóa Key ${name}?`)) {
                let keys = await fetchOnlineKeys();
                delete keys[name];
                await saveOnlineKeys(keys);
                renderKeyList();
            }
        }

        async function renderKeyList() {
            let container = document.getElementById('keyListContainer');
            container.innerHTML = `<span style="color:#aaa; text-align:center;">Đang tải danh sách...</span>`;
            let keys = await fetchOnlineKeys();
            container.innerHTML = "";
            let keyArray = Object.keys(keys);
            if(keyArray.length === 0) { container.innerHTML = `<span style="color:#888; text-align:center;">Chưa có Key nào.</span>`; return; }

            let now = Date.now();
            keyArray.forEach(k => {
                let kData = keys[k];
                let h = typeof kData === 'object' ? kData.hours : kData;
                let u = typeof kData === 'object' ? kData.uses : '∞';
                let ipInfo = (typeof kData === 'object' && kData.device_ip) ? kData.device_ip : "Trống";
                let activatedAt = typeof kData === 'object' ? kData.activated_at : null;
                
                let statusText = "Chưa kích hoạt";
                if (activatedAt) {
                    let expireTime = activatedAt + (h * 3600000);
                    if (now > expireTime) statusText = "<span style='color:#ef4444;'>Hết hạn</span>";
                    else statusText = `Còn ${((expireTime - now)/(3600000)).toFixed(1)}h`;
                }

                let div = document.createElement('div');
                div.className = 'key-row';
                div.innerHTML = `<span><b>${k}</b> (${h}h - ${u}l)<br><small style="color:#3b82f6;">IP: ${ipInfo} | ${statusText}</small></span>
                <div class="key-actions">
                    <button onclick="copyKeyText('${k}')" style="background:#3b82f6; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer;">Copy</button>
                    <button onclick="deleteKey('${k}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer;">Xóa</button>
                </div>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
