<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK ADMIN PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; position: relative; }
        
        /* MÀN HÌNH ĐĂNG NHẬP ADMIN */
        #authScreen { width: 100%; max-width: 380px; background: rgba(22, 22, 30, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; border: 1px solid rgba(34, 197, 94, 0.3); text-align: center; }
        #authScreen h2 { font-size: 1.3rem; letter-spacing: 2px; color: #22c55e; }
        .key-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: #121218; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        .key-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }

        /* BẢNG QUẢN LÝ CHÍNH */
        #adminPanel { display: none; width: 100%; max-width: 450px; background: #16161e; border-radius: 20px; padding: 20px; border: 1px solid #22c55e; flex-direction: column; gap: 14px; box-shadow: 0 0 25px rgba(34, 197, 94, 0.2); }
        .key-row { display: flex; justify-content: space-between; align-items: center; background: #0f0f15; padding: 10px; border-radius: 10px; font-size: 0.8rem; gap: 8px; }
        .key-actions { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <!-- ĐĂNG NHẬP MẬT KHẨU ADMIN -->
    <div id="authScreen">
        <h2>🔒 ADMIN LOGIN</h2>
        <input type="password" id="adminPassInput" class="key-input" placeholder="Nhập mật khẩu Admin...">
        <button onclick="verifyAdmin()" class="key-btn">TRUY CẬP HỆ THỐNG</button>
    </div>

    <!-- BẢNG QUẢN LÝ SAU KHI ĐĂNG NHẬP THÀNH CÔNG -->
    <div id="adminPanel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color:#22c55e;">👑 QUẢN LÝ KEY ONLINE</h3>
            <span style="color:#ef4444; font-size: 0.8rem; cursor:pointer; font-weight: bold;" onclick="location.reload()">Đăng xuất</span>
        </div>
        
        <textarea id="newKeyName" class="key-input" placeholder="Tên Key (Ví dụ: KEY1, KEY2... cách nhau dấu phẩy)" style="padding: 10px; height: 60px; font-size: 0.85rem; resize: none;"></textarea>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="newKeyHours" class="key-input" placeholder="Số giờ..." style="padding: 10px;">
            <input type="number" id="newKeyUses" class="key-input" placeholder="Số lượt..." style="padding: 10px;">
        </div>
        <button onclick="createNewKeysBulk()" class="key-btn" style="padding: 12px;">+ TẠO / CẬP NHẬT KEY</button>
        
        <hr style="border: 0; border-top: 1px solid #333;">
        
        <div style="font-size: 0.85rem; font-weight: bold; color: #3b82f6;">Danh sách Key hiện có trên hệ thống:</div>
        <div id="keyListContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto;"></div>
    </div>

    <script>
        const ADMIN_PASS = "ADMIN123";
        const FIREBASE_URL = "https://headlock-df1ab-default-rtdb.firebaseio.com/keys";

        function verifyAdmin() {
            let pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'flex';
                renderKeyList();
            } else {
                alert("Sai mật khẩu Admin!");
            }
        }

        async function fetchOnlineKeys() {
            try {
                let res = await fetch(`${FIREBASE_URL}.json`);
                let data = await res.json();
                return data || {};
            } catch (e) { return {}; }
        }

        async function saveOnlineKeys(keys) {
            await fetch(`${FIREBASE_URL}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(keys)
            });
        }

        async function createNewKeysBulk() {
            let rawInput = document.getElementById('newKeyName').value.trim();
            let hours = parseInt(document.getElementById('newKeyHours').value);
            let uses = parseInt(document.getElementById('newKeyUses').value);

            if (!rawInput || isNaN(hours) || isNaN(uses)) { 
                alert("Vui lòng nhập đầy đủ tên Key, Số giờ và Số lượt!"); 
                return; 
            }

            let keyList = rawInput.split(',').map(k => k.trim().toUpperCase()).filter(k => k.length > 0);
            let keys = await fetchOnlineKeys();

            keyList.forEach(k => { 
                keys[k] = { hours: hours, uses: uses, device_ip: null, activated_at: null }; 
            });
            await saveOnlineKeys(keys);

            document.getElementById('newKeyName').value = "";
            document.getElementById('newKeyHours').value = "";
            document.getElementById('newKeyUses').value = "";
            renderKeyList();
            alert(`Đã tạo/cập nhật thành công ${keyList.length} Key!`);
        }

        function copyKeyText(keyName) {
            navigator.clipboard.writeText(keyName).then(() => {
                alert(`Đã sao chép Key: ${keyName}`);
            }).catch(err => {
                let textArea = document.createElement("textarea");
                textArea.value = keyName;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert(`Đã sao chép Key: ${keyName}`);
                } catch (e) {
                    alert("Không thể sao chép!");
                }
                document.body.removeChild(textArea);
            });
        }

        async function deleteKey(name) {
            if(confirm(`Xóa Key ${name} trên toàn hệ thống?`)) {
                let keys = await fetchOnlineKeys();
                delete keys[name];
                await saveOnlineKeys(keys);
                renderKeyList();
            }
        }

        async function renderKeyList() {
            let container = document.getElementById('keyListContainer');
            container.innerHTML = `<span style="color:#aaa; font-size:0.8rem; text-align:center;">Đang tải danh sách...</span>`;
            let keys = await fetchOnlineKeys();
            container.innerHTML = "";
            let keyArray = Object.keys(keys);

            if(keyArray.length === 0) {
                container.innerHTML = `<span style="color:#888; font-size:0.8rem; text-align:center;">Chưa có Key nào.</span>`;
                return;
            }

            let now = Date.now();
            keyArray.forEach(k => {
                let kData = keys[k];
                let h = typeof kData === 'object' ? kData.hours : kData;
                let u = typeof kData === 'object' ? kData.uses : '∞';
                let ipInfo = (typeof kData === 'object' && kData.device_ip) ? kData.device_ip : "Trống";
                let activatedAt = typeof kData === 'object' ? kData.activated_at : null;
                
                let statusText = "Hoạt động";
                if (activatedAt) {
                    let expireTime = activatedAt + (h * 60 * 60 * 1000);
                    if (now > expireTime) {
                        statusText = "<span style='color:#ef4444;'>Đã hết hạn/Khóa</span>";
                    } else {
                        let remainingHours = ((expireTime - now) / (1000 * 60 * 60)).toFixed(1);
                        statusText = `Còn ${remainingHours}h`;
                    }
                } else {
                    statusText = "Chưa kích hoạt";
                }

                let div = document.createElement('div');
                div.className = 'key-row';
                div.innerHTML = `<span><b>${k}</b> (${h}h - ${u}l)<br><small style="color:#3b82f6;">IP: ${ipInfo} | Trạng thái: ${statusText}</small></span>
                <div class="key-actions">
                    <button onclick="copyKeyText('${k}')" style="background:#3b82f6; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer; height:fit-content;">Sao chép</button>
                    <button onclick="deleteKey('${k}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:5px; cursor:pointer; height:fit-content;">Xóa</button>
                </div>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
