<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK - ADMIN PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #050505; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px 12px 60px 12px; }
        .admin-content { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
        
        .admin-card { background: rgba(18, 18, 24, 0.96); backdrop-filter: blur(14px); border-radius: 20px; padding: 20px; border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 14px; }
        .admin-card h2 { font-size: 1.2rem; color: #38bdf8; text-align: center; letter-spacing: 1px; }
        
        .admin-group { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; font-size: 0.8rem; color: #94a3b8; }
        .admin-input, .admin-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: #121218; color: #fff; font-size: 0.9rem; outline: none; }
        .admin-row { display: flex; gap: 10px; }
        .admin-action-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #38bdf8; color: #0f172a; font-weight: 800; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(56,189,248,0.3); }
        .admin-action-btn:active { transform: scale(0.98); }

        .admin-key-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #121218; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); font-family: monospace; font-size: 0.75rem; }
        .admin-key-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 6px; border-left: 3px solid #38bdf8; }
        .key-info div { color: #22c55e; margin-top: 2px; font-size: 0.65rem; }
        .btn-group { display: flex; gap: 4px; }
        .del-key-btn { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .reset-ip-btn { background: #eab308; color: #000; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }

        .login-box { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 400px; margin-top: 60px; background: rgba(22, 22, 30, 0.92); padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .login-box h2 { color: #fff; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="admin-content">
        <!-- MÀN HÌNH ĐĂNG NHẬP ADMIN -->
        <div id="loginScreen" class="login-box">
            <h2>🔐 ĐĂNG NHẬP ADMIN</h2>
            <div class="admin-group">
                <label>Mật khẩu quản trị:</label>
                <input type="password" id="adminPassword" class="admin-input" placeholder="Nhập mật khẩu (Mặc định: admin123)">
            </div>
            <button onclick="loginAdmin()" class="admin-action-btn">ĐĂNG NHẬP</button>
        </div>

        <!-- BẢNG ĐIỀU KHIỂN CHÍNH (Ẩn khi chưa đăng nhập) -->
        <div id="adminDashboard" class="admin-card" style="display: none;">
            <h2>🛡️ QUẢN LÝ KEY HEADLOCK</h2>
            
            <div class="admin-group">
                <label>Tên / Mã Key mới:</label>
                <input type="text" id="newKeyName" class="admin-input" placeholder="VD: VIP-THANG-01">
            </div>

            <div class="admin-row">
                <div class="admin-group" style="flex:1;">
                    <label>Loại thời gian:</label>
                    <select id="keyDurationType" class="admin-select" onchange="toggleDurationInput()">
                        <option value="minutes">Phút</option>
                        <option value="hours">Giờ</option>
                        <option value="days">Ngày (Tháng)</option>
                        <option value="permanent">Vĩnh Viễn</option>
                    </select>
                </div>
                <div class="admin-group" style="flex:1;" id="durationValueBox">
                    <label id="durationLabel">Số lượng:</label>
                    <input type="number" id="keyDurationVal" class="admin-input" value="30" min="1">
                </div>
            </div>

            <button onclick="adminCreateKey()" class="admin-action-btn">➕ TẠO KEY MỚI</button>
            
            <div class="admin-group" style="margin-top: 10px;">
                <label>Danh sách toàn bộ Key hệ thống:</label>
                <div class="admin-key-list" id="adminKeyListContainer">Đang tải dữ liệu...</div>
            </div>

            <button onclick="logoutAdmin()" style="background: transparent; border: none; color: #ef4444; font-size: 0.8rem; cursor: pointer; font-weight: bold; margin-top: 5px;">🔒 Đăng xuất Admin</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://headlock-df1ab-default-rtdb.firebaseio.com/keys";

        function loginAdmin() {
            let pass = document.getElementById('adminPassword').value.trim();
            if (pass === "admin123") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                loadAdminKeyList();
            } else {
                alert("Mật khẩu Admin không đúng! (Mặc định: admin123)");
            }
        }

        function logoutAdmin() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPassword').value = "";
        }

        function toggleDurationInput() {
            let type = document.getElementById('keyDurationType').value;
            let box = document.getElementById('durationValueBox');
            let label = document.getElementById('durationLabel');
            if (type === 'permanent') {
                box.style.display = 'none';
            } else {
                box.style.display = 'flex';
                if (type === 'minutes') label.innerText = "Số phút:";
                else if (type === 'hours') label.innerText = "Số giờ:";
                else if (type === 'days') label.innerText = "Số ngày:";
            }
        }

        async function adminCreateKey() {
            let keyName = document.getElementById('newKeyName').value.trim().toUpperCase();
            if (!keyName) { alert("Vui lòng nhập tên Key!"); return; }

            let type = document.getElementById('keyDurationType').value;
            let val = parseInt(document.getElementById('keyDurationVal').value) || 1;
            let durationMs = 0;
            let isPermanent = false;

            if (type === 'minutes') durationMs = val * 60 * 1000;
            else if (type === 'hours') durationMs = val * 3600 * 1000;
            else if (type === 'days') durationMs = val * 24 * 3600 * 1000;
            else if (type === 'permanent') isPermanent = true;

            try {
                let res = await fetch(`${FIREBASE_URL}.json`);
                let keys = await res.json() || {};

                keys[keyName] = {
                    durationMs: durationMs,
                    isPermanent: isPermanent,
                    device_ip: null,
                    activated_at: null
                };

                await fetch(`${FIREBASE_URL}.json`, { method: 'PUT', body: JSON.stringify(keys) });
                alert(`Đã tạo thành công key: ${keyName}`);
                document.getElementById('newKeyName').value = "";
                loadAdminKeyList();
            } catch (e) {
                alert("Lỗi kết nối tới cơ sở dữ liệu!");
            }
        }

        async function loadAdminKeyList() {
            let container = document.getElementById('adminKeyListContainer');
            container.innerText = "Đang tải danh sách...";
            try {
                let res = await fetch(`${FIREBASE_URL}.json`);
                let keys = await res.json() || {};
                container.innerHTML = "";

                let keysArr = Object.keys(keys);
                if (keysArr.length === 0) {
                    container.innerHTML = "<div style='text-align:center; color:#666;'>Chưa có key nào trên hệ thống</div>";
                    return;
                }

                keysArr.forEach(k => {
                    let info = keys[k];
                    let typeStr = "";
                    if (info.isPermanent) {
                        typeStr = "Vĩnh viễn 👑";
                    } else if (info.durationMs) {
                        let totalMins = Math.round(info.durationMs / 60000);
                        if (totalMins >= 1440) typeStr = Math.round(totalMins / 1440) + " Ngày (Tháng)";
                        else if (totalMins >= 60) typeStr = Math.round(totalMins / 60) + " Giờ";
                        else typeStr = totalMins + " Phút";
                    }

                    let statusText = info.device_ip ? `Đã khóa máy: ${info.device_ip}` : "Trạng thái: Chưa sử dụng";

                    let div = document.createElement('div');
                    div.className = 'admin-key-item';
                    div.innerHTML = `
                        <div class="key-info">
                            <b>${k}</b> [${typeStr}]
                            <div>${statusText}</div>
                        </div>
                        <div class="btn-group">
                            ${info.device_ip ? `<button class="reset-ip-btn" onclick="resetKeyIP('${k}')" title="Xóa thiết bị để khách đổi máy">Reset IP</button>` : ''}
                            <button class="del-key-btn" onclick="deleteKey('${k}')">Xóa</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<div style='color:#ef4444;'>Lỗi tải danh sách key.</div>";
            }
        }

        async function deleteKey(keyName) {
            if (!confirm(`Bạn có chắc muốn xóa vĩnh viễn key ${keyName}?`)) return;
            let res = await fetch(`${FIREBASE_URL}.json`);
            let keys = await res.json() || {};
            if (keys[keyName]) {
                delete keys[keyName];
                await fetch(`${FIREBASE_URL}.json`, { method: 'PUT', body: JSON.stringify(keys) });
                loadAdminKeyList();
            }
        }

        async function resetKeyIP(keyName) {
            if (!confirm(`Bạn muốn reset thiết bị cho key ${keyName} để cho phép đăng nhập máy khác?`)) return;
            let res = await fetch(`${FIREBASE_URL}.json`);
            let keys = await res.json() || {};
            if (keys[keyName]) {
                keys[keyName].device_ip = null;
                keys[keyName].activated_at = null; // Cho phép kích hoạt tính thời gian lại từ đầu nếu muốn
                await fetch(`${FIREBASE_URL}.json`, { method: 'PUT', body: JSON.stringify(keys) });
                alert(`Đã reset thành công key ${keyName}!`);
                loadAdminKeyList();
            }
        }
    </script>
</body>
</html>
